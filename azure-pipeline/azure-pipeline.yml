trigger: none
pr: none

parameters:
- name: useRealSigning
  displayName: Use production signing (manual runs only)
  type: boolean
  default: true

schedules:
- cron: '0 0 14 * *'
  displayName: Monthly non-production build
  branches:
    include:
    - main
  always: true

resources:
  repositories:
  - repository: MicroBuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release

name: $(Date:yyyyMMdd).$(Rev:r)

variables:
- name: TeamName
  value: Asp.Net
- name: EnableNuGetPackageRestore
  value: true
- name: SignType
  ${{ if and(eq(variables['Build.Reason'], 'Manual'), eq(parameters.useRealSigning, true)) }}:
    value: real
  ${{ else }}:
    value: test

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    pool:
      name: VSEngSS-MicroBuild2022-1ES
      os: windows
    sdl:
      binskim:
        enable: true
      codeql:
        enable: true
      policheck:
        enable: true
      tsa:
        enable: true
      sourceAnalysisPool:
        name: AzurePipelines-EO
        image: 1ESPT-Windows2022
        os: windows
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    stages:
    - stage: Build
      displayName: Build
      jobs:
      - job: Build
        displayName: Build and sign packages
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 1
        pool:
          name: VSEngSS-MicroBuild2022-1ES
        templateContext:
          mb:
            signing:
              enabled: true
              zipSources: false
              ${{ if and(eq(variables['Build.Reason'], 'Manual'), eq(parameters.useRealSigning, true)) }}:
                signType: real
                signWithProd: true
              ${{ else }}:
                signType: test
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Artifact: Nuget packages'
            artifactName: Nuget packages
            targetPath: $(Build.SourcesDirectory)\bin\Release\Packages
            sbomEnabled: true
            sbomBuildDropPath: $(Build.SourcesDirectory)\bin\Release\Packages
            sbomBuildComponentPath: $(Build.SourcesDirectory)\bin\Release\Packages
            sbomPackageName: Microsoft.AspNet.OutputCache
            sbomValidate: true
        steps:
        - checkout: self
          clean: true
          fetchTags: true
        - task: NuGetToolInstaller@1
          displayName: Use NuGet 6.4.0
          inputs:
            versionSpec: 6.4.0
            checkLatest: false
        - task: NuGetAuthenticate@1
          displayName: Authenticate Azure Artifacts feeds
        - task: NuGetCommand@2
          displayName: Install MicroBuild bootstrap package
          inputs:
            command: custom
            arguments: install Microsoft.VisualStudioEng.MicroBuild.Core -Version 0.4.1 -OutputDirectory .\packages -Source https://pkgs.dev.azure.com/devdiv/_packaging/MicroBuildToolset/nuget/v3/index.json -NonInteractive
        - task: NuGetCommand@2
          displayName: Restore NuGet packages
          inputs:
            command: restore
            restoreSolution: Microsoft.AspNet.OutputCache.sln
            feedsToUse: config
            nugetConfigPath: .nuget/NuGet.Config
        - task: MSBuild@1
          displayName: Build solution MicrosoftAspNetOutputCache.msbuild
          inputs:
            solution: MicrosoftAspNetOutputCache.msbuild
            msbuildVersion: 17.0
            msbuildArchitecture: x64
            configuration: Release
            msbuildArguments: /p:GitCommit=$(Build.SourceVersion) /p:GitCommitLink="https://github.com/aspnet/AspNetOutputCache/commit/$(Build.SourceVersion)" /p:SignType=$(SignType) /p:SignAssembly=true /verbosity:n
            clean: true
            createLogFile: true
            logFileVerbosity: detailed
          timeoutInMinutes: 120
        - task: CopyFiles@2
          displayName: Stage dll's for verification
          inputs:
            SourceFolder: $(Build.SourcesDirectory)\bin\Release
            Contents: Microsoft.AspNet.OutputCache.*.dll
            TargetFolder: $(Build.SourcesDirectory)\verify\dlls
            CleanTargetFolder: true
            OverWrite: true
        - task: CopyFiles@2
          displayName: Stage nupkg's for verification
          inputs:
            SourceFolder: $(Build.SourcesDirectory)\bin\Release\Packages
            Contents: |
              Microsoft.AspNet.OutputCache.*.nupkg
              !*.symbols.nupkg
            TargetFolder: $(Build.SourcesDirectory)\verify\packages
            CleanTargetFolder: true
            OverWrite: true
        - task: ms-vseng.MicroBuildShipTasks.7c429315-71ba-4cb3-94bb-f829c95f7915.MicroBuildCodesignVerify@1
          displayName: Verify Signed Binaries
          inputs:
            TargetFolder: $(Build.SourcesDirectory)\verify\dlls
            ExcludeFolders: .git MicroBuild apiscan
        - task: ms-vseng.MicroBuildShipTasks.7c429315-71ba-4cb3-94bb-f829c95f7915.MicroBuildCodesignVerify@1
          displayName: Verify Signed Packages
          inputs:
            TargetFolder: $(Build.SourcesDirectory)\verify\packages
            WhiteListPathForCerts: $(Build.SourcesDirectory)\tools\.verif.whitelist
            ExcludeFolders: .git MicroBuild decomp *.xml
        # APIScan is an explicit API Usage compliance scan; it is not injected by the 1ES template.
        - task: APIScan@2
          displayName: Run APIScan
          inputs:
            softwareFolder: '$(Build.SourcesDirectory)\verify\dlls'
            softwareName: 'Microsoft.AspNet.OutputCache'
            softwareVersionNum: '*'
            softwareBuildNum: '$(Build.BuildId)'
            symbolsFolder: '$(Build.SourcesDirectory)\bin\Release;SRV*http://symweb'
            verbosityLevel: 'none'
            toolVersion: 'Latest'
            azureSubscription: 'VSEng-APIScanSC'
          env:
            AzureServicesAuthConnectionString: RunAs=App;AppId=d318cba7-db4d-4fb3-99e1-01879cb74e91;TenantId=72f988bf-86f1-41af-91ab-2d7cd011db47;ServiceConnectionId=93e24264-c5e6-4681-8175-ec8a41668480;
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
